# cosmx, GCN, radius graph: predict the hidden cells' expression (regression) with InterScale's LocalModel.
model:
  local_component: { name: GIN }
  global_component: { name: self-attn-transformer } # not used by LocalModel, need to have to avoid errors
  decoder: { type: linear }
  save: results/checkpoints/ # lets InterScale restore the best epoch
optim:
  loss: GaussianNLL # regression loss
  accelerator: cpu
  n_epochs: 500
  min_epochs: 100
  patience: 50 # early stopping on val_loss (regression)
dataset:
  h5ad_data: data/cosmx_prepared.h5ad
  name: cosmx_radius_gnll_batch_2 # checkpoint files are named after this, so include the graph type
  prediction_task: regression
  prediction_level: node
  layer_key: log1p_norm # normalised layer
  sample_key: ["sample"] # one graph per organoid section
  split_key: split
  batch_size: 2
  connectivity_key: radius_connectivities
wandb:
  use: true
  project_name: cosmx-graphs
